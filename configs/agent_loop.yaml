# Pass with: actor_rollout_ref.rollout.agent.agent_loop_config_path=configs/agent_loop.yaml
# and set PYTHONPATH to include this repo and MEDAGENTGYM_ROOT to the MedAgentGym clone.
- name: medagentgym
  _target_: opd.agent_loop.MedAgentGymAgentLoop
  max_turns: 15              # MedAgentGym num_steps
  debugger: policy           # "policy" = the model being trained answers debug requests; "none" = disabled
  debugger_max_tokens: 1024
  format_reward_weight: 0.0  # paper uses a correctness + format reward; weight not reported
  # Time limits. These were meant to be 30 s / 30 s / 300 s, but until the Nov 18 fix (see opd/agent_loop.py)
  # yaml settings were ignored and every training run used the defaults below: MedAgentGym's 120 s per code
  # run (same as the paper and our eval) and no episode budget. Kept at those values so new runs match all
  # earlier runs.
  terminal_timeout: 120
  code_timeout: null         # null = MedAgentGym's 120 s
  episode_time_budget: null  # null = no per-episode wall-clock budget
